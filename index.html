<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Budget</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL BUDGET</p>
        <h1>My Budget</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </header>

    <section class="balance-card">
      <div class="label">Available</div>
      <div class="balance" id="balance">$0.00</div>
      <div class="muted">Income minus expenses</div>
    </section>

    <section class="stats">
      <div class="stat"><span>Income</span><strong id="income">$0.00</strong></div>
      <div class="stat"><span>Spent</span><strong id="spent">$0.00</strong></div>
    </section>

    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-tab="home">Home</button>
      <button class="tab" data-tab="transactions">Transactions</button>
      <button class="tab" data-tab="budget">Budget</button>
      <button class="tab" data-tab="goals">Goals</button>
    </nav>

    <section class="panel active" id="home">
      <div class="section-head"><h2>Upcoming bills</h2><button class="small-btn" data-open="bill">+ Add</button></div>
      <div id="homeBills" class="stack"></div>

      <div class="section-head"><h2>Savings goals</h2><button class="small-btn" data-open="goal">+ Add</button></div>
      <div id="homeGoals" class="stack"></div>

      <div class="section-head"><h2>Recent transactions</h2><button class="small-btn" data-tab-target="transactions">View all</button></div>
      <div id="homeTransactions" class="stack"></div>
    </section>

    <section class="panel" id="transactions">
      <div class="section-head"><h2>Transactions</h2><button class="primary" data-open="transaction">+ Add transaction</button></div>
      <div id="transactionList" class="stack"></div>
    </section>

    <section class="panel" id="budget">
      <div class="section-head"><h2>Monthly budget</h2><button class="primary" data-open="budget">+ Add budget</button></div>
      <div id="budgetList" class="stack"></div>
    </section>

    <section class="panel" id="goals">
      <div class="section-head"><h2>Savings goals</h2><button class="primary" data-open="goal">+ Add goal</button></div>
      <div id="goalList" class="stack"></div>
      <div class="section-head bills-head"><h2>Bills</h2><button class="primary" data-open="bill">+ Add bill</button></div>
      <div id="billList" class="stack"></div>
    </section>

    <footer>Data stays in this browser on this device.</footer>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <h2 id="modalTitle">Add</h2>
      <form id="form"></form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
